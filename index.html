<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HFaniry - Portfolio</title>
    <meta name="description" content="Portfolio de HFaniry - Développeur d'application et passionné" />
    
    <!-- Préchargement des polices critiques -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Préchargement des ressources critiques -->
    <link rel="preload" as="image" href="/src/assets/images/pdp1.jpg" imagesrcset="/src/assets/images/pdp1.jpg 1x, /src/assets/images/pdp1@2x.jpg 2x">
    
    <!-- Préchargement du CSS critique -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <!-- Préchargement des scripts critiques -->
    <link rel="modulepreload" href="/src/main.tsx" as="script">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" async></script>
    <!-- Chargement différé des polices non critiques -->
    <script>
      /* Fonction pour charger les polices de manière asynchrone */
      function loadFonts() {
        const link = document.createElement('link');
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
        link.rel = 'stylesheet';
        document.head.appendChild(link);
      }
      
      // Charger les polices après le chargement de la page
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadFonts);
      } else {
        loadFonts();
      }
    </script>
  </body>
</html>
